<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defect Scanner</title>
    <!-- SEO and Metadata -->
    <meta name="description" content="Analyze images for defects by detecting changes and anomalies within a single image. Adjust parameters for precise results.">
    <meta property="og:title" content="Defect Scanner - Comparison-Based Analysis">
    <meta property="og:description" content="Analyze single images for defects by detecting internal changes and anomalies.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://digitalchaos68.github.io/AIimagescan/compare-opencv.html">
    <meta property="og:image" content="https://digitalchaos68.github.io/AIimagescan/image/main-app-splash.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Defect Scanner - Comparison-Based Analysis">
    <meta name="twitter:description" content="Scan a single image for defects using a change-based AI analysis.">
    <meta name="twitter:image" content="https://digitalchaos68.github.io/AIimagescan/image/main-app-splash.jpg">
    <link rel="canonical" href="https://digitalchaos64.github.io/AIimagescan/compare-opencv.html">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Defect Scanner",
      "description": "AI-powered tool for finding defects and anomalies in a single image.",
      "applicationCategory": "Utilities",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "url": "https://digitalchaos64.github.io/AIimagescan/compare-opencv.html",
      "logo": "https://digitalchaos64.github.io/AIimagescan/image/logo.png"
    }
    </script>
    
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
    <!-- Link to the OpenCV.js library from a CDN -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
</head>

<body>
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5.5 0 01-9 0zM18.894 6.182a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.06l1.59-1.591zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM17.83 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.06 1.06l1.59 1.591zM12 18.75a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM4.929 17.83a.75.75 0 001.06 1.06l1.591-1.59a.75.75 0 10-1.06-1.06l-1.59 1.591zM3 12a.75.75 0 01.75-.75h2.25a.75.75 0 010 1.5H3.75A.75.75 0 013 12zM6.182 6.182a.75.75 0 00-1.06-1.06l-1.59 1.591a.75.75 0 101.06 1.06l1.591-1.59z" />
        </svg>
    </button>
    <div class="container compare-container">
        <!-- Back Button -->
        <button onclick="window.location.href='index.html'">
            Back to Main Menu
        </button>
        <div class="sidebar compare-card">
            <h1 class="title">Defect Scanner</h1>
        
            <!-- Splash Image -->
            <img src="image/main-app-splash.jpg" alt="Defect Scanner - AI Image Quality Control" style="width: 100%; height: auto; border-radius: 8px; margin: 20px 0;">
        

            <p class="subtitle">Upload an image and set parameters to find surface defects.</p>
            <div class="input-group">
                <label for="imageInput" class="block text-sm font-medium mb-1">Upload Image</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full text-sm">
            </div>

            <hr class="my-4 border-t border-gray-300 dark:border-gray-600">
            
            <div class="input-group">
                <label for="minAreaInput" class="block text-sm font-medium mb-1">Min Defect Area</label>
                <input type="number" id="minAreaInput" value="2000" min="1" class="w-full px-2 py-1 border rounded-md">
            </div>

            <div class="input-group">
                <label for="densityThresholdInput" class="block text-sm font-medium">Density Threshold</label>
                <input type="range" id="densityThresholdInput" value="100" min="1" max="255" step="1">
                <div class="value-display" id="densityThresholdValue">100</div>
            </div>
            
            <div class="input-group">
                <label for="minRatioInput" class="block text-sm font-medium">Min Aspect Ratio</label>
                <input type="range" id="minRatioInput" value="1.0" min="0.1" max="1.0" step="0.1">
                <div class="value-display" id="minRatioValue">1.0</div>
            </div>
            
            <div class="input-group">
                <label for="maxRatioInput" class="block text-sm font-medium">Max Aspect Ratio</label>
                <input type="range" id="maxRatioInput" value="10.0" min="1.0" max="10.0" step="0.5">
                <div class="value-display" id="maxRatioValue">10.0</div>
            </div>
            
            <button id="scanButton" class="btn primary-btn mt-4">Check for Defect</button>
            <p id="loadingStatus" class="status-message">Please upload an image to begin.</p>
        </div>
        
        <div class="main-content">
            <div class="image-display compare-card" id="image-container">
                <p class="text-placeholder">Image preview will appear here.</p>
            </div>
            
            <div class="results-section compare-card" id="results-container">
                <h2 class="section-title">Scan Results</h2>
                <p>Results will be displayed here after scanning.</p>
            </div>
        </div>
    </div>

    <script>
        let isCvReady = false; // Flag to prevent multiple initializations
        
        // Check if OpenCV.js is ready
        function onOpenCvReady() {
            // This flag prevents the function from running more than once
            // in case the script onload event fires multiple times.
            if (isCvReady) {
                return;
            }
            isCvReady = true;

            // Load a default image for a better user experience
            const initialImage = new Image();
            initialImage.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = initialImage.width;
                canvas.height = initialImage.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(initialImage, 0, 0);
                document.getElementById('image-container').innerHTML = '';
                document.getElementById('image-container').appendChild(canvas);
                document.getElementById('loadingStatus').textContent = 'OpenCV.js loaded. Ready to scan.';
            };
            initialImage.src = 'https://placehold.co/800x600/e0e0e0/ffffff?text=Upload+Image+Here';
        }
        
        // General page logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        const imageInput = document.getElementById('imageInput');
        const scanButton = document.getElementById('scanButton');
        const imageContainer = document.getElementById('image-container');
        const resultsContainer = document.getElementById('results-container');
        const loadingStatus = document.getElementById('loadingStatus');

        let originalImage = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        originalImage = img;
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        imageContainer.innerHTML = '';
                        imageContainer.appendChild(canvas);
                        loadingStatus.textContent = 'Image loaded. Click "Check for Defect" to scan.';
                        scanButton.disabled = false;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        scanButton.addEventListener('click', () => {
            if (!originalImage) {
                loadingStatus.textContent = 'Please upload an image first.';
                return;
            }

            loadingStatus.textContent = 'Scanning for defects...';
            resultsContainer.innerHTML = `<h2 class="section-title">Scan Results</h2><div class="loader"></div>`;

            // Debounce or add a small delay to show the loading state
            setTimeout(() => {
                detectDefects(originalImage);
            }, 100);
        });

        function detectDefects(img) {
            if (!cv) {
                loadingStatus.textContent = 'OpenCV.js is not loaded yet.';
                return;
            }
            
            // Clean up old mats to prevent memory leaks
            let src = cv.imread(img);
            let gray = new cv.Mat();
            let blur = new cv.Mat();
            let binary = new cv.Mat();
            let distMap = new cv.Mat();
            let distMapNorm = new cv.Mat();
            let thresholdedDensity = new cv.Mat();
            let markers = new cv.Mat.zeros(src.rows, src.cols, cv.CV_32SC1);
            let hierarchy = new cv.Mat();
            let contours = new cv.MatVector();
            let contoursFinal = new cv.MatVector();
            let hierarchyFinal = new cv.Mat();
            let defectRects = []; // Array to store all defect bounding boxes
            
            try {
                // Pre-processing
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                cv.bitwise_not(gray, gray); // Invert colors to find black defects
                cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
                cv.adaptiveThreshold(blur, binary, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 2);

                // Watershed analysis for defect separation
                cv.distanceTransform(binary, distMap, cv.DIST_L2, 5);
                cv.normalize(distMap, distMapNorm, 0, 255, cv.NORM_MINMAX, cv.CV_8U);

                let densityThreshold = parseInt(document.getElementById('densityThresholdInput').value);
                cv.threshold(distMapNorm, thresholdedDensity, densityThreshold, 255, cv.THRESH_BINARY);
                
                // Prepare markers for watershed
                cv.findContours(thresholdedDensity, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
                for (let i = 0; i < contours.size(); ++i) {
                    cv.drawContours(markers, contours, i, new cv.Scalar(i + 1), -1);
                }
                
                // Convert src to RGB for watershed and apply the algorithm
                cv.cvtColor(src, src, cv.COLOR_RGBA2RGB);
                cv.watershed(src, markers);

                // Final processing of markers to find defects
                let defectCount = 0;
                let minArea = parseInt(document.getElementById('minAreaInput').value);

                cv.findContours(markers, contoursFinal, hierarchyFinal, cv.RETR_CCOMP, cv.CHAIN_APPROX_SIMPLE);

                for (let i = 0; i < contoursFinal.size(); ++i) {
                    let contour = contoursFinal.get(i);
                    let area = cv.contourArea(contour);

                    if (area > minArea) {
                        let rect = cv.boundingRect(contour);
                        let ratio = rect.width / rect.height;
                        let minRatio = parseFloat(document.getElementById('minRatioInput').value);
                        let maxRatio = parseFloat(document.getElementById('maxRatioInput').value);

                        if (ratio >= minRatio && ratio <= maxRatio) {
                            defectRects.push(rect); // Store the bounding box
                            defectCount++;
                        }
                    }
                    contour.delete();
                }

                // Debugging step: show the intermediate images with labels
                const intermediateImagesContainer = document.createElement('div');
                intermediateImagesContainer.classList.add('intermediate-images');
                
                const createLabeledCanvas = (mat, label) => {
                    const container = document.createElement('div');
                    const p = document.createElement('p');
                    p.textContent = label;
                    const canvas = document.createElement('canvas');
                    cv.imshow(canvas, mat);
                    container.appendChild(p);
                    container.appendChild(canvas);
                    intermediateImagesContainer.appendChild(container);
                };

                createLabeledCanvas(gray, 'Grayscale Image');
                createLabeledCanvas(blur, 'Blurred Image');
                createLabeledCanvas(binary, 'Binary Image');
                createLabeledCanvas(distMapNorm, 'Distance Map');
                createLabeledCanvas(thresholdedDensity, 'Thresholded Density Map');
                
                resultsContainer.appendChild(intermediateImagesContainer);

                // Draw the final image with the bounding boxes
                const canvasOutput = document.createElement('canvas');
                canvasOutput.width = img.width;
                canvasOutput.height = img.height;
                const ctx = canvasOutput.getContext('2d');
                
                // Draw the original image first
                ctx.drawImage(img, 0, 0);
                
                // Draw the rectangles on top of the original image
                for (let i = 0; i < defectRects.length; i++) {
                    let rect = defectRects[i];
                    ctx.beginPath();
                    ctx.lineWidth = "5";
                    ctx.strokeStyle = "red";
                    ctx.rect(rect.x, rect.y, rect.width, rect.height);
                    ctx.stroke();
                }

                // Put the canvas in the resultsContainer
                resultsContainer.appendChild(canvasOutput);
                
                // Add a title for the final image
                const finalImageTitle = document.createElement('p');
                finalImageTitle.textContent = "Final Result";
                resultsContainer.insertBefore(finalImageTitle, canvasOutput);

                const resultText = document.createElement('p');
                if (defectCount > 0) {
                    resultText.textContent = `Found ${defectCount} potential defect(s).`;
                    resultText.style.color = 'red';
                } else {
                    resultText.textContent = `No defects found.`;
                    resultText.style.color = 'green';
                }
                resultsContainer.prepend(resultText);

                loadingStatus.textContent = 'Scan complete.';

            } catch (err) {
                loadingStatus.textContent = 'An error occurred during scanning: ' + err;
                console.error(err);
            } finally {
                // Proper memory management
                src.delete(); gray.delete(); blur.delete(); binary.delete();
                distMap.delete(); distMapNorm.delete(); thresholdedDensity.delete();
                markers.delete(); hierarchy.delete(); contours.delete();
                contoursFinal.delete(); hierarchyFinal.delete();
            }
        }

        // Update range slider values
        document.getElementById('densityThresholdInput').addEventListener('input', (e) => {
            document.getElementById('densityThresholdValue').textContent = e.target.value;
        });
        document.getElementById('minRatioInput').addEventListener('input', (e) => {
            document.getElementById('minRatioValue').textContent = e.target.value;
        });

        document.getElementById('maxRatioInput').addEventListener('input', (e) => {
            document.getElementById('maxRatioValue').textContent = e.target.value;
        });
    </script>
</body>
</html>
