<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defect Scanner - Comparison</title>

    <!-- SEO and Metadata -->
    <meta name="description" content="Analyze a single image for defects by detecting changes and anomalies. Adjust parameters for precise results using computer vision.">
    <meta property="og:title" content="Defect Scanner - Comparison-Based Analysis">
    <meta property="og:description" content="Analyze single images for defects by detecting internal changes and anomalies.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://digitalchaos68.github.io/AIimagescan/compare-opencv.html">
    <meta property="og:image" content="https://digitalchaos68.github.io/AIimagescan/image/main-app-splash.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:description" content="Scan a single image for defects using a change-based AI analysis.">
    <meta name="twitter:image" content="https://digitalchaos68.github.io/AIimagescan/image/main-app-splash.jpg">
    <link rel="canonical" href="https://digitalchaos64.github.io/AIimagescan/compare-opencv.html">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Defect Scanner",
      "description": "AI-powered tool for finding defects and anomalies in a single image.",
      "applicationCategory": "Utilities",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "url": "https://digitalchaos64.github.io/AIimagescan/compare-opencv.html",
      "logo": "https://digitalchaos64.github.io/AIimagescan/image/logo.png"
    }
    </script>
    
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            @apply bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-200;
        }
        body.dark-mode .bg-white {
            @apply bg-gray-800;
        }
        body.dark-mode .text-gray-800 {
            @apply text-gray-200;
        }
        body.dark-mode .border-gray-300 {
            @apply border-gray-600;
        }
        body.dark-mode .bg-gray-50 {
            @apply bg-gray-700;
        }
        body.dark-mode .bg-gray-200 {
            @apply bg-gray-700;
        }
        .text-placeholder {
            @apply text-gray-400 dark:text-gray-500;
        }
        .loader {
            border-top-color: #3498db;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <!-- Link to the OpenCV.js library from a CDN -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
    <div class="fixed top-4 right-4 z-50">
        <button id="theme-toggle" class="p-2 rounded-full shadow-lg bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-6 h-6 fill-current">
                <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5.5 0 01-9 0zM18.894 6.182a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.06l1.59-1.591zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM17.83 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.06 1.06l1.59 1.591zM12 18.75a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM4.929 17.83a.75.75 0 001.06 1.06l1.591-1.59a.75.75 0 10-1.06-1.06l-1.59 1.591zM3 12a.75.75 0 01.75-.75h2.25a.75.75 0 010 1.5H3.75A.75.75 0 013 12zM6.182 6.182a.75.75 0 00-1.06-1.06l-1.59 1.591a.75.75 0 101.06 1.06l1.591-1.59z" />
            </svg>
        </button>
    </div>

    <!-- Main Container -->
    <div class="container mx-auto p-4 md:p-8 flex flex-col items-center max-w-4xl min-h-screen">
        <!-- Back and Navigation Buttons -->
        <div class="flex justify-between w-full mb-4 space-x-4">
            <button onclick="window.location.href='index.html'" class="flex-1 text-center px-4 py-2 text-sm font-semibold text-white bg-indigo-500 rounded-lg shadow-md hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="inline-block h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15l-3-3m0 0l3-3m-3 3h8m-2 4h4a2 2 0 002-2v-4a2 2 0 00-2-2h-4" />
                </svg>
                Back to Main Menu
            </button>
            <button onclick="alert('Next module not configured yet.')" class="flex-1 text-center px-4 py-2 text-sm font-semibold text-white bg-gray-500 rounded-lg shadow-md hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors duration-200">
                Next Module
                <svg xmlns="http://www.w3.org/2000/svg" class="inline-block h-4 w-4 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 9l3 3m0 0l-3 3m3-3H6m-2 4h4a2 2 0 002-2v-4a2 2 0 00-2-2H4" />
                </svg>
            </button>
        </div>
        
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 w-full transition-colors duration-300">
            <h1 class="text-3xl font-bold text-center mb-2">Defect Scanner</h1>
            <h2 class="text-xl text-center text-gray-600 dark:text-gray-400 mb-6">Comparison-Based Analysis</h2>
            
            <!-- Splash Image -->
            <img src="https://digitalchaos68.github.io/AIimagescan/image/main-app-splash.jpg" alt="Defect Scanner - AI Image Quality Control" class="w-full h-auto rounded-xl shadow-inner mb-6">

            <p class="text-center text-gray-700 dark:text-gray-300 mb-6">
                Upload an image and set parameters to find surface defects by analyzing changes and anomalies.
            </p>

            <!-- Image Upload Input -->
            <div class="mb-4">
                <label for="imageInput" class="block text-sm font-semibold mb-2">Upload Image</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full text-sm rounded-lg border-2 border-gray-300 dark:border-gray-600 p-2 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Parameters Section -->
            <hr class="my-6 border-t border-gray-300 dark:border-gray-600">
            <div id="parameters">
                <h3 class="text-xl font-semibold mb-4">Detection Parameters</h3>
                <div class="space-y-4">
                    <div class="input-group">
                        <label for="minAreaInput" class="block text-sm font-semibold mb-1">Min. Defect Area (pixels)</label>
                        <input type="number" id="minAreaInput" value="2000" min="1" class="w-full px-4 py-2 border-2 border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    
                    <div class="input-group">
                        <label for="densityThresholdInput" class="block text-sm font-semibold mb-1">Density Threshold</label>
                        <input type="range" id="densityThresholdInput" value="100" min="1" max="255" step="1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700">
                        <div class="value-display text-xs text-right text-gray-500 dark:text-gray-400 mt-1" id="densityThresholdValue">100</div>
                    </div>
                    
                    <div class="input-group">
                        <label for="minRatioInput" class="block text-sm font-semibold mb-1">Min. Aspect Ratio</label>
                        <input type="range" id="minRatioInput" value="1.0" min="0.1" max="10.0" step="0.1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700">
                        <div class="value-display text-xs text-right text-gray-500 dark:text-gray-400 mt-1" id="minRatioValue">1.0</div>
                    </div>
                    
                    <div class="input-group">
                        <label for="maxRatioInput" class="block text-sm font-semibold mb-1">Max. Aspect Ratio</label>
                        <input type="range" id="maxRatioInput" value="10.0" min="1.0" max="10.0" step="0.5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700">
                        <div class="value-display text-xs text-right text-gray-500 dark:text-gray-400 mt-1" id="maxRatioValue">10.0</div>
                    </div>
                </div>
            </div>

            <!-- Scan Button -->
            <button id="scanButton" class="w-full px-6 py-3 mt-6 text-lg font-bold text-white bg-indigo-600 rounded-xl shadow-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors duration-200">
                Check for Defect
            </button>
            <p id="loadingStatus" class="mt-4 text-center text-sm text-gray-500 dark:text-gray-400">
                Please upload an image to begin.
            </p>
        </div>

        <!-- Image and Results Container -->
        <div id="imageAndResultsContainer" class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 mt-8 w-full flex flex-col items-center min-h-[400px] transition-colors duration-300">
            <h2 class="text-2xl font-bold mb-4">Image Preview & Results</h2>
            <div id="image-display" class="w-full bg-gray-100 dark:bg-gray-700 rounded-xl p-4 flex justify-center items-center min-h-[300px] text-gray-500 dark:text-gray-400 text-center relative overflow-hidden">
                <p class="text-placeholder">Image preview will appear here.</p>
            </div>
            <div id="results-display" class="w-full mt-6 space-y-4">
                <!-- Results will be injected here -->
            </div>
        </div>
    </div>

    <script>
        let isCvReady = false;
        let originalImage = null;

        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        // Check if OpenCV.js is ready
        function onOpenCvReady() {
            if (isCvReady) {
                return;
            }
            isCvReady = true;

            const initialImage = new Image();
            initialImage.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = initialImage.width;
                canvas.height = initialImage.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(initialImage, 0, 0);
                
                const imageDisplayDiv = document.getElementById('image-display');
                imageDisplayDiv.innerHTML = '';
                imageDisplayDiv.appendChild(canvas);
                
                document.getElementById('loadingStatus').textContent = 'OpenCV.js loaded. Ready to scan.';
            };
            initialImage.src = 'https://placehold.co/800x600/e0e0e0/ffffff?text=Upload+Image+Here';
        }
        
        const imageInput = document.getElementById('imageInput');
        const scanButton = document.getElementById('scanButton');
        const imageDisplay = document.getElementById('image-display');
        const resultsDisplay = document.getElementById('results-display');
        const loadingStatus = document.getElementById('loadingStatus');
        
        // Helper function to create and append a titled canvas
        function createTitledCanvas(title, parentElement, mat) {
            const container = document.createElement('div');
            container.className = 'flex flex-col items-center mb-4';

            const titleElem = document.createElement('h4');
            titleElem.textContent = title;
            titleElem.className = 'text-center font-semibold mb-2';
            container.appendChild(titleElem);

            const canvas = document.createElement('canvas');
            canvas.className = 'w-full max-w-full h-auto rounded-lg shadow-md';
            cv.imshow(canvas, mat);
            container.appendChild(canvas);
            
            parentElement.appendChild(container);
        }

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        originalImage = img;
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        
                        imageDisplay.innerHTML = '';
                        imageDisplay.appendChild(canvas);
                        loadingStatus.textContent = 'Image loaded. Click "Check for Defect" to scan.';
                        scanButton.disabled = false;
                        resultsDisplay.innerHTML = '';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        scanButton.addEventListener('click', () => {
            if (!originalImage) {
                loadingStatus.textContent = 'Please upload an image first.';
                return;
            }

            loadingStatus.textContent = 'Scanning for defects...';
            resultsDisplay.innerHTML = `<h3 class="text-xl font-semibold mb-4 text-center">Scan Results</h3><div class="flex justify-center items-center h-24"><div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div></div>`;

            setTimeout(() => {
                detectDefects(originalImage);
            }, 100);
        });

        function detectDefects(img) {
            if (!cv) {
                loadingStatus.textContent = 'OpenCV.js is not loaded yet.';
                return;
            }
            
            let src = cv.imread(img);
            let gray = new cv.Mat();
            let blur = new cv.Mat();
            let binary = new cv.Mat();
            let distMap = new cv.Mat();
            let distMapNorm = new cv.Mat();
            let thresholdedDensity = new cv.Mat();
            let markers = cv.Mat.zeros(src.rows, src.cols, cv.CV_32SC1);
            let hierarchy = new cv.Mat();
            let contours = new cv.MatVector();
            let contoursFinal = new cv.MatVector();
            let hierarchyFinal = new cv.Mat();
            let defectRects = [];
            
            try {
                // Step 1: Pre-process the image
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                cv.bitwise_not(gray, gray);
                createTitledCanvas('Grayscale & Inverted Image', resultsDisplay, gray);

                cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);

                cv.adaptiveThreshold(blur, binary, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 2);
                createTitledCanvas('Binary Image', resultsDisplay, binary);

                // Step 2: Use Distance Transform and Watershed
                cv.distanceTransform(binary, distMap, cv.DIST_L2, 5);
                cv.normalize(distMap, distMapNorm, 0, 255, cv.NORM_MINMAX, cv.CV_8U);
                createTitledCanvas('Distance Map', resultsDisplay, distMapNorm);

                let densityThreshold = parseInt(document.getElementById('densityThresholdInput').value);
                cv.threshold(distMapNorm, thresholdedDensity, densityThreshold, 255, cv.THRESH_BINARY);
                createTitledCanvas('Thresholded Density Map', resultsDisplay, thresholdedDensity);
                
                cv.findContours(thresholdedDensity, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
                for (let i = 0; i < contours.size(); ++i) {
                    cv.drawContours(markers, contours, i, new cv.Scalar(i + 1), -1);
                }
                
                cv.cvtColor(src, src, cv.COLOR_RGBA2RGB);
                cv.watershed(src, markers);
                createTitledCanvas('Watershed Segments', resultsDisplay, markers);

                // Step 3: Analyze and filter defects
                let defectCount = 0;
                let minArea = parseInt(document.getElementById('minAreaInput').value);
                let minRatio = parseFloat(document.getElementById('minRatioInput').value);
                let maxRatio = parseFloat(document.getElementById('maxRatioInput').value);

                cv.findContours(markers, contoursFinal, hierarchyFinal, cv.RETR_CCOMP, cv.CHAIN_APPROX_SIMPLE);

                for (let i = 0; i < contoursFinal.size(); ++i) {
                    let contour = contoursFinal.get(i);
                    let area = cv.contourArea(contour);

                    if (area > minArea) {
                        let rect = cv.boundingRect(contour);
                        let ratio = rect.width / rect.height;

                        if (ratio >= minRatio && ratio <= maxRatio) {
                            defectRects.push(rect);
                            defectCount++;
                        }
                    }
                    contour.delete(); 
                }

                // Step 4: Display final result
                const finalResultTitle = document.createElement('h3');
                finalResultTitle.className = 'text-xl font-semibold mb-4 text-center mt-6';
                finalResultTitle.textContent = 'Final Result';
                resultsDisplay.appendChild(finalResultTitle);
                
                const resultText = document.createElement('p');
                resultText.className = 'text-center text-lg font-bold';
                if (defectCount > 0) {
                    resultText.textContent = `Found ${defectCount} potential defect(s).`;
                    resultText.classList.add('text-red-500');
                } else {
                    resultText.textContent = `No defects found.`;
                    resultText.classList.add('text-green-500');
                }
                resultsDisplay.appendChild(resultText);

                const canvasOutput = document.createElement('canvas');
                canvasOutput.width = img.width;
                canvasOutput.height = img.height;
                const ctx = canvasOutput.getContext('2d');
                
                ctx.drawImage(img, 0, 0);
                
                for (let i = 0; i < defectRects.length; i++) {
                    let rect = defectRects[i];
                    ctx.beginPath();
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = "red";
                    ctx.rect(rect.x, rect.y, rect.width, rect.height);
                    ctx.stroke();
                }
                
                canvasOutput.className = 'w-full max-w-full h-auto rounded-lg shadow-md';
                resultsDisplay.appendChild(canvasOutput);

                loadingStatus.textContent = 'Scan complete.';

            } catch (err) {
                loadingStatus.textContent = 'An error occurred during scanning: ' + err.message;
                console.error(err);
            } finally {
                if (src) src.delete();
                if (gray) gray.delete();
                if (blur) blur.delete();
                if (binary) binary.delete();
                if (distMap) distMap.delete();
                if (distMapNorm) distMapNorm.delete();
                if (thresholdedDensity) thresholdedDensity.delete();
                if (markers) markers.delete();
                if (hierarchy) hierarchy.delete();
                if (contours) contours.delete();
                if (contoursFinal) contoursFinal.delete();
                if (hierarchyFinal) hierarchyFinal.delete();
            }
        }

        // Update range slider values
        document.getElementById('densityThresholdInput').addEventListener('input', (e) => {
            document.getElementById('densityThresholdValue').textContent = e.target.value;
        });
        document.getElementById('minRatioInput').addEventListener('input', (e) => {
            document.getElementById('minRatioValue').textContent = e.target.value;
        });
        document.getElementById('maxRatioInput').addEventListener('input', (e) => {
            document.getElementById('maxRatioValue').textContent = e.target.value;
        });
    </script>
</body>
</html>
