<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Defect Scanner - Comparison-Based Analysis</title>
    
    <!-- SEO and Metadata -->
    <meta name="description" content="Compare two images to detect defects and anomalies. Adjust the sensitivity for precise results.">
    <meta property="og:title" content="Defect Scanner - Comparison-Based Analysis">
    <meta property="og:description" content="Compare two images to find defects.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://digitalchaos68.github.io/AIimagescan/compare-opencv.html">
    <meta property="og:image" content="https://digitalchaos68.github.io/AIimagescan/image/main-app-splash.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Defect Scanner - Comparison-Based Analysis">
    <meta name="twitter:description" content="Compare two images to find defects using an AI analysis.">
    <meta name="twitter:image" content="https://digitalchaos68.github.io/AIimagescan/image/main-app-splash.jpg">
    <link rel="canonical" href="https://digitalchaos64.github.io/AIimagescan/compare-opencv.html">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Defect Scanner",
      "description": "AI-powered tool for finding defects and anomalies by comparing two images.",
      "applicationCategory": "Utilities",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "url": "https://digitalchaos64.github.io/AIimagescan/compare-opencv.html",
      "logo": "https://digitalchaos64.github.io/AIimagescan/image/logo.png"
    }
    </script>
    
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
    <!-- Link to the OpenCV.js library from a CDN -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
</head>
<body>
    <!-- Dark mode toggle button -->
    <div class="toggle-container">
        <button id="theme-toggle" class="theme-toggle-button">Toggle Dark Mode</button>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Back Button -->
        <button onclick="window.location.href='index.html'">
            Back to Main Menu
        </button>

        <h1>Defect Scanner</h1>
        <h2>Based on Image Comparison</h2>
        
        <!-- Splash Image -->
        <img src="image/main-app-splash.jpg" alt="Defect Scanner - AI Image Quality Control" style="width: 100%; height: auto; border-radius: 8px; margin: 20px 0;">
        
        <p>
            Upload a reference image and a test image to scan for defects.
        </p>

        <!-- Image Upload Inputs -->
        <div class="image-upload-container">
            <div>
                <label for="referenceImageInput">Reference Image:</label>
                <input type="file" id="referenceImageInput" accept="image/*">
            </div>
            <div>
                <label for="testImageInput">Test Image:</label>
                <input type="file" id="testImageInput" accept="image/*">
            </div>
        </div>
        
        <!-- Loading Status -->
        <div id="loadingStatus" class="mt-4 text-center text-sm font-medium text-gray-500">
            Ready to scan.
        </div>

        <!-- Scan Button -->
        <button id="compareButton" style="display: none;">
            Compare Images
        </button>
        
        <!-- Detection Parameters -->
        <div id="parameters" style="margin-top: 20px;">
            <h3>Detection Parameters</h3>
            <div>
                <label for="thresholdInput">Detection Threshold:</label>
                <input type="range" id="thresholdInput" value="50" min="0" max="255" step="1">
                <span id="thresholdValue">50</span>
            </div>
        </div>

        <!-- Image and Results Container -->
        <div id="image-container"></div>
        <div id="results-container"></div>
    </div>
    
    <script src="compare-opencv.js"></script>
    <script>
        function onOpenCvReady() {
            document.getElementById('loadingStatus').textContent = 'OpenCV.js is ready. Select two images to begin.';
            console.log('OpenCV.js is ready.');
        }
    </script>
</body>
</html>
